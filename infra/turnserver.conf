# coturn for Remote Assist. The shared secret and realm are passed on the command line from
# infra/.env (see docker-compose.yml).

listening-port=3478
# Relay ports: open this UDP range in the VPS firewall too.
min-port=49160
max-port=49260

# Short-lived credentials minted by the signaling server (the "TURN REST API").
use-auth-secret
fingerprint
stale-nonce=600

# Plain TURN: the media inside is already encrypted end to end (DTLS-SRTP).
no-tls
no-dtls
no-tcp-relay

# Limits sized for a family, not a public service. max-bps is bytes per second per session.
user-quota=12
total-quota=60
max-bps=1000000

# Never relay into private, loopback, link-local or reserved networks, so the relay cannot be
# used to reach the VPS itself or anything behind it.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
log-file=stdout
simple-log
